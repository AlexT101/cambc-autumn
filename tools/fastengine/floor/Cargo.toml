[package]
name = "fastengine-floor"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# cambc 4.0.0 embeds wasmtime 49.0.2 (its compile cache lives in modules/wasmtime-49.0.2/); default features, as
# cambc (its modules are compiled for the copying GC collector, the default).
wasmtime = "=49.0.2"
anyhow = "1"
object = "0.37"
zstd = "0.13"
postcard = { version = "1", features = ["alloc"] }

[profile.release]
debug = 1
