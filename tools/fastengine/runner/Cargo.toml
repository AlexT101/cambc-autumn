[package]
name = "fastengine-runner"
version = "0.1.0"
edition = "2021"
publish = false

# A preload library: `fastrunner` (the launcher script) runs cambc with LD_PRELOAD=libfastrunner.so,
# whose __libc_start_main hook replaces cambc's main. The engine must run inside the cambc executable:
# its thread-locals use the local-exec TLS model, which breaks if the binary is dlopened.
[lib]
name = "fastrunner"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# cambc 5.0.0 (like 4.0.0) embeds wasmtime 49.0.2 (vendored, with a modified out_of_gas). vendor/wasmtime is
# upstream 49.0.2 plus wasmtime-49.0.2-cambc.patch (setup_vendor.sh); compiled code is unchanged.
wasmtime = "=49.0.2"
anyhow = "1"
object = "0.37"
libc = "0.2"
libdeflater = "1.26"
crc32fast = "1"
# The scenario subcommand's specs and output (JSON lines).
serde_json = "1"
# Native mode: the translator reads modules with wasmtime's own parser and asks its Cranelift translation how
# bulk-memory fuel was placed (vendored hook).
wasmparser = { version = "=0.258.3", default-features = false, features = ["std", "simd", "validate"] }
wasmtime-internal-cranelift = "=49.0.2"

[patch.crates-io]
wasmtime = { path = "vendor/wasmtime" }
wasmtime-internal-cranelift = { path = "vendor/wasmtime-internal-cranelift" }

[profile.release]
debug = 1
panic = "unwind"
