result:
  win: "A team reaching 1000 tributed gems wins immediately."
  round_limit: "After round 2000, more tributed gems wins, then more lifetime gold earned, then more champion kills. A full tie goes to team B."
  hidden_scores: "Bots can read both teams' tributed gems, but not gold earned or kills."

map:
  size: "Published maps run from 29x29 up to 100x100 tiles. The local engine also plays maps outside that range."
  coordinates: "(x, y), origin (0, 0) at the bottom-left; x increases east, y increases north."
  distance: "Ranges, radii, areas and \"nearest\" use Chebyshev distance."
  symmetry: {horizontal: "(x, y) -> (W-1-x, y)", vertical: "(x, y) -> (x, H-1-y)", rotational: "(x, y) -> (W-1-x, H-1-y)"}
  symmetry_rule: "The map's symmetry maps team A's spawn, terrain, altars and camps onto team B's."
  tiles:
    wall: "Blocks walking, landing and dash paths. Opaque, and never visible itself."
    hole: "Blocks walking and landing; dash paths may cross it; transparent."
    bush: "Walkable."
    altar: "Blocks walking and landing; dash paths may cross it."
  occupancy: "One unit per tile. Champions and camps block walking and landing."
  corners: "Diagonal steps, walked or on a dash path, only check the tile stepped onto: they may pass between two diagonally touching blockers of any kind, so a one-tile diagonal wall line does not block movement. The SDK's distance_field and reachable_tiles match."
  spawn: "Each team has a spawn region (3x3, 4x4, 4x3 or 5x2 on the competition maps). Enemies can never enter or land on it, but they can attack into it."

draft:
  picks: "The map sets 3-5 picks per team. There is one draft round per pick, numbered from 0, and both teams pick each round."
  visibility: "A pick stays hidden from both teams until both have picked that round."
  rules: "One pick per draft turn. Repeating your own pick is an error and does not spend the turn. Both teams may pick the same champion."
  missed: "A draft turn that ends without a pick, by yield, fuel exhaustion or crash, makes that pick and every later pick random. The team's draft bot is not run again."
  information: "The draft bot sees terrain, spawns, altars and camp groups, but no live unit state."
  in_play: "Champions can read both teams' complete picks all match, so every enemy champion's type is known from round 1."
  ids: "Champion ids run in pick order: all of team A's champions, then team B's. Cassi comes before Issac."
  start: "Champions start on their own spawn tiles at full health with 0 gold."

rounds:
  numbering: "Play rounds are numbered 1-2000."
  sequence:
    - "Camp respawns."
    - "Captures."
    - "Camp attacks."
    - "Champion turns."
  champion_order: "Team A starts odd rounds and team B even rounds. Teams alternate one champion at a time, dead ones included; once one team has no turns left, the other's remaining champions act in a row."
  team_order: "Within a team, higher priority acts first and ties go by id. Priority is any int32 and starts at 0. A new priority applies from the next round and persists."
  turn_start: "Resolve timers that reached 0, in order: respawn, ward recharge, buff and shield expiry, channel completion."
  turn_end: "On own spawn, heal to full. Then tick ability cooldowns, buffs (stun, shield, enhanced attack), channels and the respawn timer by 1. Cooldowns, buffs and channels started this turn tick too."

turn:
  walk: "One step to any of the 8 neighbours."
  attack: "One basic attack: Strength damage to a visible enemy champion, camp or enemy altar lock in range. Melee range is 1, ranged range is 3."
  melee: "Walking and attacking are independent."
  ranged: "A walk or a basic attack spends both."
  cast: "One successful ability cast per turn across both slots."
  free: "Wards, shopping, consumables and priority spend no walk, attack or cast."
  errors: "A rejected action raises an error and spends nothing."
  hidden_blocker: "Acting onto a tile that holds an unseen unit is not an error: it fails, spends nothing, and reveals that tile to the actor for the rest of the round."
  channelling: "You may act before starting a channel; while channelling you can only cancel a recall or tribute. A teleport cannot be cancelled."
  channel_limits: "Recall and tribute can each be started once per turn; cancelling does not refund the start."

abilities:
  cooldown: "A slot cast in round t can be cast again in round t+8."
  scaling: "Amounts are a multiplier x current Focus."
  range: "Unit, ground and ally abilities have range 4."
  unit_target: "Unit and ally abilities need a visible target of an allowed kind: an ally within range but out of the caster's sight is refused. The caster's own ward's sight counts, from the turn it is placed."
  ground_target: "Any tile in range, including walls and unseen tiles. The 3x3 area around it hits enemy champions (even unseen ones) and camps, never allies or the caster, once on cast."
  exclusive: "An excludes-walking spell cannot be cast after walking this turn, and walking is forbidden after it. No ability spends the walk or the basic attack."
  attack_reset: "Self-cast. Restores a spent basic attack, never the walk, and fails while the attack is unspent. A ranged champion can walk, reset, then attack."
  dash: "Move to a free tile by a path of at most 2 king steps. The path may cross holes, altars, allies and unseen enemy champions, but not walls, visible camps, visible enemy champions or the enemy spawn. An unseen camp does not block it."
  stun: "Removes the target's next turn (no walking, attacking, casting, shopping, consumables, wards or recall start; priority can still be set) and cancels its recall, tribute or teleport. The lost turn still ends: on its own spawn it heals to full, and cooldowns and buffs tick. Stuns do not stack: extra stuns before that turn are wasted; one landing after it removes the following turn. A stunned camp skips its next attack."

combat:
  modifiers: "Damage modifiers multiply and are never rounded. Health, damage and Strength are fractional."
  kill: "The champion landing the killing blow gets 100 gold (150 with a Hunter emblem, before gold bonuses) and all of the victim's carried gems. Assists give nothing. The victim keeps its gold and items."
  camp_kill: "A champion killed by a camp loses its carried gems."

camps:
  types:
    wolf: {health: 1350, strength: 20, range: 3, gold: 40, gems: 4, respawn: 40}
    elk: {health: 2400, strength: 60, range: 4, gold: 90, gems: 15, respawn: 60}
    golem: {health: 5000, strength: 120, range: 4, gold: 160, gems: 36, respawn: 80}
    gem_cluster: {health: 120, strength: 0, gold: 0, gems: 7, respawn: 50}
    gold_cluster: {health: 120, strength: 0, gold: 20, gems: 0, respawn: 50}
    monolith: {health: 20000, strength: 200, range: 5, gold: 300, gems: 200, respawn: 150}
  groups: "Cardinally connected monsters form a group. A group wakes together and shares one reward, the sum of its members'. Its camp tiles (SDK: spawn tiles) are its monsters' spawn positions."
  wake: "Damage or a stun to any member, awake or asleep, wakes every asleep member of its group."
  sleep: "Each awake monster sleeps after 2 consecutive camp phases with no champion within its own range, so a group can be part asleep. The phase after a monster wakes counts as occupied. Damage does not keep it awake. Camps never regenerate."
  attack: "Each awake monster attacks once per camp phase, dealing Strength damage to the nearest champion of either team within its range; ties go to the champion that acts first in that round's turn order, not the lowest id. Bushes do not hide champions from camps. Monsters never move."
  state: "Bots can read whether a camp is dead, awake or asleep while its tile (its last tile, if dead) is in vision. While any one of the group's camp tiles is in vision (not necessarily all), they can read its group state and capture state (SDK: state(), capture_state()), even with the capturers unseen: ally capturing, enemy capturing, contested, capture available, or none. While a team captures, its timer is the rounds to payout (paid at the capture phase of the current round + timer); otherwise it reads 5."

capture:
  condition: "After every monster in a group dies, the group stays empty until captured. A team captures it by standing on any of its camp tiles while no enemy stands on any. Adjacent tiles do not count."
  timing: "If held from round R, the reward is paid at the capture phase of round R+6, or R+4 with a Capture emblem owner holding from R. An owner joining a hold already under way, in round J, brings payout to min(R+6, J+3); its leaving does not undo that. Progress resets the moment the tiles become empty or contested, mid-turn included; re-holding restarts the count."
  reward: "Allies on the camp tiles at payout split the gems and gold. Each gets the floor share, and the lowest id also gets the remainder. A Prospector emblem's owner also gets 25% of its share, the remainder included, of the group's gem and gold cluster members' rewards, rounded down separately for gold and gems."
  respawn: "At payout the group's timer is set to its longest member respawn. The group returns, asleep at full health, at the start of round payout + timer; if a champion of either team stands on any of its camp tiles at that round start, or a teleport channel is headed to one, it returns at the start of the first round that finds them all empty. Occupation before then does not delay it."

gems:
  sources: "Gems come only from capture shares and champion kills, and score nothing until tributed."
  tribute: "Start a tribute (SDK: submit gems) within 1 of an altar while carrying at least 1 gem. The channel lasts b = max(1, ceil(starting gems / 10)) turn ends, or b - floor(0.33 b) with a Tribute emblem (unchanged up to 30 gems). On completion the whole current bag is scored, including capture shares paid during the channel; a channelling champion on a camp tile holds it as usual. Damage does not interrupt it; stun cancels it and the gems stay carried."

altar_locks:
  place: "Place a carried lock on an altar within 2. Each team can have at most one lock per altar."
  effect: "Placing a lock cancels every tribute channel at that altar, both teams'. A lock blocks only the other team's tributes."
  removal: "Five basic attacks remove a lock; spells do not affect it. An enemy tribute attempt at a locked altar counts as one of those attacks and spends the basic attack. Locks never expire."

economy:
  gold: "Gold comes only from capture shares, kill gold and Marcella's passive. Gold is fractional; gold_count shows the floor."
  bonuses: "Gold bonuses add together and apply to each capture share, to kill gold and to Marcella's tribute gold, never to gems."
  shop: "Buy any number of items on your own spawn or while dead."
  shards: "30 gold each; a shard adds the champion's growth in its stat. Each emblem family has a Strength, Health and Focus shard. Five identical shards (25 for Greed) combine automatically into that emblem. Emblems cannot be bought directly."
  emblems:
    monster: "+15% damage to camps"
    power: "stats of 6 shards, no passive"
    durability: "-10% damage taken, before a shield absorbs it: the shield drains by the reduced damage"
    treasure: "+10% gold"
    jungle: "-30% damage from camps"
    home: "recall takes 3 turn ends"
    bruiser: "stats of 5 shards plus one shard of each other stat, no passive"
    tribute: "tribute channels 33% shorter"
    capture: "capture countdown capped at 3"
    prospector: "+25% of its own capture share of cluster rewards"
    hunter: "+50 kill gold"
    skirmish: "+5% damage to champions, basic attacks and abilities; none to camps"
    greed: "25 shards (750 gold) combine into the stats of 35 shards, no passive"
    collectors: "+1% damage, to champions and camps, per distinct emblem family owned, Collectors included; shards and duplicate emblems add nothing"
  stacking: "Shard stats stack across duplicate emblems; a family's passive applies once."
  health_purchase: "Health bought on your own spawn also heals by the amount gained. Bought anywhere else, it raises max health only."
  consumables: {teleport_crystal: {cost: 10, carry: 1}, altar_lock: {cost: 10, carry: 1}}

vision:
  champion: "A 17x17 square (radius 8), using symmetric shadowcasting from the champion's tile."
  occlusion: "Walls and bushes block sight; holes do not. A diagonal gap between two walls does not block sight. A bush tile cannot be seen from outside. Bush clusters are edge-connected (diagonal bushes are separate clusters). From inside a bush your own cluster is transparent; vision is still the shadowcast square, so own-cluster tiles beyond it, and other clusters, stay unseen. Sight is symmetric for a fixed set of opaque tiles. Attacking from a bush does not reveal the attacker."
  shadowcast_radius: "bitboard::shadow_cast(p, R) from a clear tile p is independent of radius: for r < R, the cast at r is the cast at R within Chebyshev r of p. It always contains p and every clear in-bounds neighbour of p, and never an opaque tile or one beyond R."
  personal: "Each champion sees only from its own position and its own ward, never with teammates' vision."
  unseen_units: "For a champion (ally or enemy) out of your vision, only whether it is alive can be read, and a teammate's gold. For a camp or camp group with none of its camp tiles in vision, nothing can be read, not even liveness: per-camp reads and capture_state raise error 97, occupancy boards omit it, its group state reads unknown, and its respawn cooldown reads not-respawning (error 106) even while it respawns."
  visible_champions: "A visible champion, enemy or ally, exposes its type, position, health, Strength, Focus, state, gems, items, buffs, restrictions, ability cooldowns, channel time and priority. Gold is readable for yourself and every teammate, in vision or out of it, through the raw sdk_champion_gold (the C++ gold_count() refuses anyone but self, client-side); never for an enemy, seen or not (105, api_not_teammate)."

wards:
  placement: "Place on any tile within 2, unseen tiles included. Walls, holes, altars, enemy spawn and tiles with a visible allied ward are errors; placing onto an unseen allied ward fails without an error, as acting onto any unseen unit does."
  enemy_wards: "An enemy ward, seen or unseen, does not block: both wards share the tile."
  rate: "Each champion has one ward. One placed in round t can be placed again from round t+10; a new ward replaces the old one."
  vision: "A 13x13 square (radius 6), shadowcast from the ward's tile with the same occlusion as a champion's sight (a ward on a bush sees its own cluster, one off bushes no bush tile). It counts from placement: units it reveals can be read, attacked and targeted by unit spells in the same turn."
  lifetime: "Wards never expire, take no damage, outlive their owner's death and never block walking or landing."

recall:
  channel: "Recall lasts 5 turn ends and then moves the champion to its own spawn with its gems. Any damage (shield-absorbed included) or stun cancels it. The arrival turn is a full turn."
  landing: "Wherever it recalls from, it lands on the first spawn tile free at arrival, in a fixed order: for team A row by row from (minX, minY), x rising, then y; for team B the mirror image of A's order under the map's symmetry. The first pick starts on the first tile. Spawns have at least 9 tiles, so one is always free."

teleport_crystal:
  target: "A free open or bush tile within 3, not a live camp or the enemy spawn; unseen tiles allowed, terrain in between ignored. A dead camp's tile is a valid target: its group cleared or respawning, or one dead member of a group whose others live."
  channel: "The crystal is consumed at the start. The channel lasts 3 turn ends. Units that can see the destination cannot enter it until arrival. Death cancels it; damage does not."

death:
  dead_turns: "A dead champion's bot still runs each turn, sees only through its ward, and can only shop and set its priority. It keeps its turn: placed in its team's order by its priority as if alive, it takes its alternation slot. A priority set while dead applies from the next round, while still dead, and persists through respawn."
  respawn: "A champion that died in round D respawns at its turn start in round D+61, or D+60 if it died before its own turn that round. It needs a free own spawn tile and returns with full health, both abilities ready, no gems, and its gold, items and consumables."
  respawn_turn: "It cannot walk, attack or cast on its respawn turn."

memory:
  instances: "Each champion (Cassi and Issac separately) and the draft bot run separate bot instances; they share state only through these two buffers."
  shared: "Each team has 8 zero-initialised bytes that all its champions can read and write all match. A write is visible immediately to teammates who act later."
  draft: "1024 zero-initialised bytes, written in the draft and read-only in play. Each write starts at byte 0 and leaves bytes past its end unchanged."
  linear: "Each bot instance's WASM memory can grow to 4096 pages (256 MiB); a grow past that fails. Grown memory persists into later rounds."

fuel:
  budget: "Each turn has 100000 fuel. Each bot's first turn gets more: 100x for the draft bot, 2x for a champion. Start-up is charged to the first turn. Unused fuel is lost."
  exhaustion: "Running out suspends the bot; the rest of that turn is lost. Next round it resumes where it stopped, as that round's turn, with a fresh budget and allowances."
  end_turn: "Ending a turn costs fuel: a bot that ends its turn with too little left (under 40) runs out inside end_turn, and next round's turn resumes there and ends at once, with nothing done."
  draft_exhaustion: "A draft bot that runs out after picking resumes in the next draft round."
  stdout: "Each team's output is capped at 1 MiB."

champions:
  defaults: "Abilities are slots 0 and 1 in list order. Stats are [base, growth per shard]."
  ability_keys: {target: "unit (a visible enemy champion or camp), ground, self, or ally (another allied champion)", exclusive: "excludes walking"}
  ryth:
    attack: melee
    stats: {health: [1200, 100], strength: [45, 4.5], focus: [100, 10]}
    passive: "Gains Strength equal to 1% of max health above base health."
    abilities: [{damage: 1, stun: true, target: ground, exclusive: true}, attack_reset]
  vesper_vale:
    attack: ranged
    stats: {health: [1000, 100], strength: [45, 5], focus: [100, 10]}
    passive: "+33% gold."
    abilities: [attack_reset, dash]
  prism:
    attack: ranged
    stats: {health: [700, 65], strength: [35, 2.5], focus: [80, 8]}
    passive: "+1.5 Focus per carried gem."
    abilities: [{damage: 1.5, stun: true, target: unit, exclusive: true}, {damage: 1, target: ground, exclusive: true}]
  stellar:
    attack: ranged
    stats: {health: [650, 65], strength: [30, 3.5], focus: [70, 8.5]}
    abilities: [{damage: 2, target: unit, exclusive: true}, {damage: 1.4, target: ground, exclusive: true}]
  vendetta:
    attack: melee
    stats: {health: [1000, 100], strength: [70, 6], focus: [100, 10]}
    passive: "Killing a champion or monster readies both abilities."
    abilities: [attack_reset, dash]
  marcella:
    attack: melee
    stats: {health: [1200, 100], strength: [45, 4.5], focus: [60, 14]}
    passive: "Immune to stuns. Gains 2 gold per gem she tributes, when the tribute completes; gold bonuses apply."
    abilities: ["attack_reset; her next basic attack this turn also stuns", {damage: 2, target: unit, exclusive: true}]
  tavi:
    attack: ranged
    stats: {health: [900, 75], strength: [45, 5], focus: [110, 10]}
    passive: "Buys shards anywhere; consumables still need spawn or death. On spawn, sells items for their full price (shard 30, emblem 150, Greed emblem 750); refunds are not earned gold."
    abilities: [attack_reset, {damage: 1.6, stun: true, target: unit, exclusive: true}]
  willow:
    attack: ranged
    stats: {health: [700, 50], strength: [55, 3], focus: [140, 5]}
    abilities: [{heal: 3, target: ally}, attack_reset]
  ren:
    attack: melee
    stats: {health: [900, 100], strength: [35, 5], focus: [100, 9]}
    passive: "When damaged, deals 0.2x Focus to the attacker (monsters included), even while dying."
    abilities: [{damage: 1.1, stun: true, target: unit, exclusive: true}, dash]
  varg:
    attack: melee
    stats: {health: [1000, 100], strength: [45, 5], focus: [100, 10]}
    passive: "Basic attacks also deal Strength to other enemy champions and camps within 1 of the target."
    abilities: [attack_reset, {shield: 2.5, target: self, duration: 5}]
    shield: "Absorbs damage before health; leftover is lost on expiry."
  heart_of_ruin:
    attack: melee
    stats: {health: [1000, 100], strength: [30, 3], focus: [100, 10]}
    passive: "All its damage x (1 + 0.5 x missing health fraction): +50% at 0 health, +25% at half. Shields do not count as health."
    abilities: [{shield: 1.5, target: self, duration: 5}, "dash; on landing, 1.5 damage and a stun to enemy champions (even unseen ones) and camps within 1 of the landing tile"]
  cassi_and_issac:
    passive: "One pick, two bodies with separate turns, positions, bags and abilities. If either dies, both die, giving one kill reward and both bags."
    cassi:
      attack: ranged
      stats: {health: [600, 65], strength: [30, 3], focus: [100, 13]}
      abilities: [{damage: 2, target: unit, exclusive: true}, {stun: true, target: unit}]
    issac:
      attack: melee
      stats: {health: [900, 80], strength: [45, 3], focus: [100, 10]}
      abilities: [attack_reset, dash]
